<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Career Generator{% endblock %}</title>
  <!-- Bootstrap 5 CSS from CDN – no install needed -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Our custom CSS -->
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <!-- Top navigation bar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1e3a5f;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        <i class="bi bi-mortarboard-fill me-2"></i>Career Generator
      </a>
      <div class="d-flex gap-3 align-items-center">
        {% if session.get("email") %}
          <!-- Logged-in state: show email and protected nav links -->
          <a class="nav-link text-white" href="{{ url_for('form') }}">
            <i class="bi bi-pencil-square me-1"></i>New Report
          </a>
          <a class="nav-link text-white" href="{{ url_for('history') }}">
            <i class="bi bi-clock-history me-1"></i>History
          </a>
          <span class="text-white opacity-75 small">
            <i class="bi bi-person-circle me-1"></i>Hello, {{ session.email }}
          </span>
          <a class="nav-link text-white" href="{{ url_for('logout') }}">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </a>
        {% else %}
          <!-- Logged-out state: show Login and Register links -->
          <a class="nav-link text-white" href="{{ url_for('login') }}">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </a>
          <a class="nav-link text-white" href="{{ url_for('register') }}">
            <i class="bi bi-person-plus me-1"></i>Register
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main content area – child templates fill this block -->
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center text-muted py-3" style="font-size:0.85rem;">
    AI-Based Personalized Career Content Generator &mdash; Rule-Based System (No LLM)
  </footer>

  <!-- Bootstrap 5 JS bundle from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
